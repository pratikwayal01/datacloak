name: publish

# Single release train: tag vX.Y.Z publishes all four packages at that version.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    strategy:
      matrix:
        workspace:
          - packages/detect
          - packages/cli
          - packages/opencode-plugin
          - packages/ner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build --workspace packages/detect
      - run: npm run build --workspace ${{ matrix.workspace }}
      - run: npm test --workspace ${{ matrix.workspace }}
      - name: package version must match tag
        run: |
          PKG="v$(node -p "require('./${{ matrix.workspace }}/package.json').version")"
          test "${{ github.ref_name }}" = "$PKG" || { echo "tag ${{ github.ref_name }} != ${{ matrix.workspace }}@$PKG"; exit 1; }
      - name: publish to npm
        run: npm publish --workspace ${{ matrix.workspace }} --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
