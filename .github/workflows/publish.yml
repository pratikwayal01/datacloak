name: publish-detect

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # npm provenance

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'detect-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build --workspace packages/detect
      - run: npm test --workspace packages/detect
      - name: release tag must match package version
        run: |
          PKG="detect-v$(node -p "require('./packages/detect/package.json').version")"
          test "${{ github.event.release.tag_name }}" = "$PKG" || { echo "release tag ${{ github.event.release.tag_name }} != package $PKG"; exit 1; }
      - run: npm publish --workspace packages/detect --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
