name: test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-test:
    strategy:
      matrix:
        workspace:
          - packages/detect
          - packages/ner
          - packages/cli
          - packages/opencode-plugin
          - packages/browser-extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace packages/detect
      - run: npm run build --workspace ${{ matrix.workspace }}
      - run: npm test --workspace ${{ matrix.workspace }}
