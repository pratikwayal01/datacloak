name: Bug report
description: Something cloaked wrong, leaked, or broke
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Shown in the popup footer (e.g. 0.3.1).
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser + version
      description: e.g. Brave 1.78, Firefox 131.
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: Site where it happened
      description: e.g. chatgpt.com, claude.ai.
    validations:
      required: false
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you pasted, what got cloaked (or leaked), what you expected. Redact real secrets — use placeholders.
    validations:
      required: true
