name: Feature request
description: Suggest an entity type, site, or workflow improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The workflow that hurts today, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should DataCloak do instead? Concrete examples help.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Detector (new entity type / pattern)
        - Extension UI
        - CLI / plugin
        - Docs / site
        - Other
    validations:
      required: false
