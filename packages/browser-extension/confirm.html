<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DataCloak — Confirm</title>
<style>
  body { font: 15px system-ui, sans-serif; background: #f6f6f6; color: #111; margin: 0; display: flex; justify-content: center; padding-top: 15vh; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 28px 32px; max-width: 520px; box-shadow: 0 8px 32px rgba(0,0,0,.12); }
  h1 { font-size: 20px; margin: 0 0 12px; }
  p { margin: 0 0 8px; color: #333; }
  code { background: #f0f0f0; padding: 1px 6px; border-radius: 4px; }
  .row { margin-top: 20px; display: flex; gap: 12px; justify-content: flex-end; }
  button { font-size: 14px; padding: 8px 20px; border-radius: 8px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
  button.danger { background: #c0392b; border-color: #c0392b; color: #fff; }
  #cf-status { margin-top: 12px; min-height: 20px; color: #c0392b; }
</style>
</head>
<body>
  <div class="card">
    <h1 id="cf-title">Confirm</h1>
    <p id="cf-desc"></p>
    <div class="row">
      <button id="cf-cancel" type="button">Cancel</button>
      <button id="cf-confirm" class="danger" type="button">Remove</button>
    </div>
    <div id="cf-status" role="alert"></div>
  </div>
  <script src="dist/confirm.js"></script>
</body>
</html>
